name: Build SanDeal APK
# Build khung AutoX TỪ MÃ NGUỒN (tag cố định), ghép loader Săn Deal, ký bằng khóa riêng, đăng Release.
on:
  workflow_dispatch:
  push:
    tags: ['apk-v*']
permissions:
  contents: write
env:
  AUTOX_TAG: v7.2.5
  APKTOOL_VER: 2.12.1
  # thư viện OCR (Google ML Kit) lấy từ APK AutoX chính thức cùng tag, khóa theo SHA-256
  AUTOX_APK_URL: https://github.com/aiselp/AutoX/releases/download/v7.2.5/Autox-v7-arm64-v8a-release-v7.2.5.apk
  AUTOX_APK_SHA256: 7a9b3d4b36776ff7cdf62199248d40a3c7b0f314086c9e948f971a6f1746b16c
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache template AutoX
        id: tpl
        uses: actions/cache@v4
        with:
          path: template.apk
          key: autox-template-${{ env.AUTOX_TAG }}

      - name: Lấy mã nguồn AutoX
        if: steps.tpl.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: aiselp/AutoX
          ref: ${{ env.AUTOX_TAG }}
          path: autox
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - if: steps.tpl.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
      - uses: android-actions/setup-android@v4
      - name: Build template AutoX từ mã nguồn
        if: steps.tpl.outputs.cache-hit != 'true'
        working-directory: autox
        run: |
          # lỗi thì đẩy 80 dòng cuối log ra annotation (xem được không cần đăng nhập)
          step() {
            echo "== $*"
            if ! "$@" > step.log 2>&1; then
              tail -80 step.log
              msg=$(tail -80 step.log | python3 -c 'import sys;print(sys.stdin.read()[-3500:].replace("%","%25").replace("\r","").replace("\n","%0A"))')
              echo "::error title=$*::$msg"
              exit 1
            fi
            tail -5 step.log
          }
          # tag v7.2.5 chưa có khóa "ndk" trong project-versions.json -> dùng bản NDK của workflow tag đó
          NDK=$(jq -r '.ndk // "26.1.10909125"' project-versions.json)
          step sdkmanager --install "ndk;$NDK"
          chmod +x ./gradlew
          step ./gradlew autojs:buildJsModule --stacktrace
          step ./gradlew app:buildDocs
          step ./gradlew app:buildTemplateApp --stacktrace
          cp app/src/main/assets/template.apk ../template.apk

      # lưu template ngay khi build xong (kể cả bước sau lỗi) để lần sau khỏi build lại
      - name: Lưu cache template
        if: steps.tpl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: template.apk
          key: autox-template-${{ env.AUTOX_TAG }}

      - name: Ghép Săn Deal + ký
        env:
          KS_B64: ${{ secrets.SANDEAL_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SANDEAL_KEYSTORE_PASS }}
        run: |
          # mọi lệnh lỗi đều đẩy log ra annotation (xem được không cần đăng nhập)
          step() {
            echo "== $1"; local t="$1"; shift
            if ! "$@" > s.log 2>&1; then
              cat s.log
              msg=$(tail -60 s.log | python3 -c 'import sys;print(sys.stdin.read()[-3500:].replace("%","%25").replace("\r","").replace("\n","%0A"))')
              echo "::error title=$t::$msg"; exit 1
            fi
            tail -5 s.log
          }
          [ -n "$KS_B64" ] || { echo "::error title=secret::Thiếu secret SANDEAL_KEYSTORE_B64"; exit 1; }
          [ -n "$KS_PASS" ] || { echo "::error title=secret::Thiếu secret SANDEAL_KEYSTORE_PASS"; exit 1; }
          step "tải apktool" curl -fsSL -o apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar"
          step "apktool d" java -jar apktool.jar d -s -f template.apk -o work
          step "tải AutoX (lấy OCR)" curl -fsSL -o autox.apk "$AUTOX_APK_URL"
          echo "$AUTOX_APK_SHA256  autox.apk" | sha256sum -c - || { echo "::error title=ocr::SHA-256 APK AutoX không khớp"; exit 1; }
          step "giải nén OCR" unzip -q -o autox.apk "lib/arm64-v8a/libmlkit_google_ocr_pipeline.so" "assets/mlkit-google-ocr-models/*" -d ocr
          step "patch" python3 build/patch.py work ocr
          step "apktool b" java -jar apktool.jar b work -o unsigned.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); echo "build-tools: $BT"
          step "zipalign" "$BT/zipalign" -p -f 4 unsigned.apk aligned.apk
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > ks.p12 || { echo "::error title=secret::SANDEAL_KEYSTORE_B64 không phải base64 hợp lệ"; exit 1; }
          step "apksigner sign" "$BT/apksigner" sign --ks ks.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias sandeal --out SanDeal.apk aligned.apk
          rm -f ks.p12
          step "apksigner verify" "$BT/apksigner" verify --print-certs SanDeal.apk
          sha256sum SanDeal.apk template.apk | tee checksums.txt

      - name: Đăng Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('apk-build-{0}', github.run_number) }}
          name: Săn Deal ${{ github.ref_name }}
          body: |
            Tải **SanDeal.apk** và cài. Khung AutoX build từ mã nguồn aiselp/AutoX tag ${{ env.AUTOX_TAG }}.
          files: |
            SanDeal.apk
            checksums.txt
